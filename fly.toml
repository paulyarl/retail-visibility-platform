# Fly.io standby config for the RVP API — hot backup for Railway.
# Build context is the repo root (same as apps/api/Dockerfile expects).
# Secrets are NOT set here — use `fly secrets set` (see railway.toml [services.variables] for the checklist).

app = "visibleshelf-api"
# Match your Upstash Redis region (ord) for lowest cache latency.
primary_region = "ord"

[build]
  dockerfile = "apps/api/Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  # Keep one machine warm so a Railway outage is a DNS flip, not a cold boot.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

  [[http_service.checks]]
    grace_period = "60s"
    interval = "10s"
    method = "GET"
    timeout = "5s"
    path = "/api/health"

[[vm]]
  memory = "4gb"
  cpu_kind = "shared"
  cpus = 2
