name: Deploy Staging

on:
  push:
    branches:
      - staging
  workflow_dispatch: # Manual trigger

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel Deployment
        run: curl -X POST "${{ secrets.VERCEL_DEPLOY_HOOK_STAGING }}"

  # Detect api-relevant changes so the Fly deploy is skipped on web-only
  # pushes (same idea as Railway's change detector).
  changes:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.check.outputs.api }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check api-affecting paths
        id: check
        run: |
          BEFORE="${{ github.event.before }}"
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BEFORE" 2>/dev/null; then
            echo "api=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$BEFORE" HEAD | grep -qE '^(apps/api/|packages/shared/|shared/|pnpm-lock\.yaml|pnpm-workspace\.yaml|fly\.staging\.toml|\.github/workflows/deploy-staging\.yml)'; then
            echo "api=true" >> "$GITHUB_OUTPUT"
          else
            echo "api=false" >> "$GITHUB_OUTPUT"
          fi

  api:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: fly-deploy-staging
      cancel-in-progress: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --ignore-scripts

      # Compile on the runner (16GB) — remote builders OOM on the tsc type
      # graph. The Dockerfile ships context dist/ when present and skips the
      # remote compile, same as local standby deploys.
      - name: Build API (tsc → dist)
        run: pnpm -C apps/api build
        env:
          NODE_OPTIONS: "--max-old-space-size=8192"

      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly staging
        run: flyctl deploy --config fly.staging.toml
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_STG }}
