name: Deploy Staging

on:
  push:
    branches:
      - staging
  workflow_dispatch: # Manual trigger

jobs:
  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel Deployment
        run: curl -X POST "${{ secrets.VERCEL_DEPLOY_HOOK_STAGING }}"

  # Detect api/web-relevant changes so each deploy is skipped when its
  # workspace didn't change (same idea as Railway's change detector).
  changes:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.check.outputs.api }}
      web: ${{ steps.check.outputs.web }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check api/web-affecting paths
        id: check
        run: |
          BEFORE="${{ github.event.before }}"
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BEFORE" 2>/dev/null; then
            echo "api=true" >> "$GITHUB_OUTPUT"
            echo "web=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CHANGED="$(git diff --name-only "$BEFORE" HEAD)"
          if echo "$CHANGED" | grep -qE '^(apps/api/|packages/shared/|shared/|pnpm-lock\.yaml|pnpm-workspace\.yaml|fly\.staging\.toml|\.github/workflows/deploy-staging\.yml)'; then
            echo "api=true" >> "$GITHUB_OUTPUT"
          else
            echo "api=false" >> "$GITHUB_OUTPUT"
          fi
          if echo "$CHANGED" | grep -qE '^(apps/web/|packages/shared/|shared/|pnpm-lock\.yaml|pnpm-workspace\.yaml|vercel\.json|\.github/workflows/deploy-staging\.yml)'; then
            echo "web=true" >> "$GITHUB_OUTPUT"
          else
            echo "web=false" >> "$GITHUB_OUTPUT"
          fi

  # API staging deploy: handled by Railway's GitHub integration
  # (visible-shelf-api-staging auto-deploys the `staging` branch).
  # aps.visibleshelf.store → h8eyp4m3.up.railway.app (Vercel DNS).
  # Fly staging app is scaled to 0; fly.staging.toml remains as the
  # restore path if Railway is ever dropped again.
