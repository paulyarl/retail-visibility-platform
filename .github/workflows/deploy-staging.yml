name: Deploy Staging

on:
  push:
    branches:
      - staging
    paths:
      - 'apps/api/**'
      - 'packages/shared/**'
      - 'shared/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'fly.staging.toml'
      - '.github/workflows/deploy-staging.yml'
  workflow_dispatch: # Manual trigger

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel Deployment
        run: curl -X POST "${{ secrets.VERCEL_DEPLOY_HOOK_STAGING }}"

  api:
    runs-on: ubuntu-latest
    concurrency:
      group: fly-deploy-staging
      cancel-in-progress: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --ignore-scripts

      # Compile on the runner (16GB) — remote builders OOM on the tsc type
      # graph. The Dockerfile ships context dist/ when present and skips the
      # remote compile, same as local standby deploys.
      - name: Build API (tsc → dist)
        run: pnpm -C apps/api build
        env:
          NODE_OPTIONS: "--max-old-space-size=8192"

      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly staging
        run: flyctl deploy --config fly.staging.toml
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_STG }}
