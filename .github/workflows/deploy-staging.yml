name: Deploy Staging

on:
  push:
    branches:
      - staging
  workflow_dispatch: # Manual trigger

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel Deployment
        run: curl -X POST "${{ secrets.VERCEL_DEPLOY_HOOK_STAGING }}"

  api:
    runs-on: ubuntu-latest
    concurrency:
      group: fly-deploy-staging
      cancel-in-progress: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly staging
        run: flyctl deploy --config fly.staging.toml
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_STG }}
